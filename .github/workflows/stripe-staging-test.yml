name: Stripe app - protected staging matrix

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full PR #3 commit SHA already proven by the required PostgreSQL gate
        required: true
        type: string

permissions:
  contents: read

jobs:
  staging-stripe:
    environment: stripe-staging
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      E2E_BASE_URL: ${{ secrets.STRIPE_STAGING_APP_URL }}
      E2E_SALEOR_API_URL: ${{ secrets.STRIPE_STAGING_SALEOR_URL }}
      E2E_CHARGE_CHANNEL_SLUG: ${{ secrets.STRIPE_STAGING_CHARGE_CHANNEL }}
      E2E_AUTHORIZATION_CHANNEL_SLUG: ${{ secrets.STRIPE_STAGING_AUTH_CHANNEL }}
    steps:
      - name: Require an immutable commit SHA
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          if ! printf '%s' "$EXPECTED_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "expected_commit must be a full 40-character commit SHA" >&2
            exit 1
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.expected_commit }}
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.28.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Require protected staging credentials
        run: |
          test -n "$E2E_BASE_URL"
          test -n "$E2E_SALEOR_API_URL"
          test -n "$E2E_CHARGE_CHANNEL_SLUG"
          test -n "$E2E_AUTHORIZATION_CHANNEL_SLUG"
      - name: Install protected browser runtime
        # GitHub's Ubuntu runner already includes the required system libraries.
        # Installing OS dependencies here can block indefinitely on apt locks.
        run: pnpm --filter saleor-app-payment-stripe exec playwright install chromium
      - name: Run protected Stripe test-mode matrix
        run: pnpm --filter saleor-app-payment-stripe test:e2e
