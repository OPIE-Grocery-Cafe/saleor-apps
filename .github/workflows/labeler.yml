name: "Pull Request Labeler"

on:
  pull_request:

permissions: {}

jobs:
  triage:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5.0.0
        with:
          # Fork label sets are intentionally smaller than upstream's. Add
          # matching labels without trying to synchronize/delete unknown ones.
          sync-labels: false
