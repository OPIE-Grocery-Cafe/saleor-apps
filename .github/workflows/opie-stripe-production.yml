name: OPIE Stripe Production Gate

on:
  pull_request:
    paths:
      - apps/stripe/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - turbo.json
      - .nvmrc
  push:
    branches: [railway-stripe]

permissions:
  contents: read

concurrency:
  group: opie-stripe-production-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stripe:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      HUSKY: 0
      APL: postgres
      PERSISTENCE_BACKEND: postgres
      COMMERCE_DATABASE_URL: postgresql://stripe_runtime:stripe-runtime-test@localhost:5432/opie_commerce
      COMMERCE_DATABASE_DIRECT_URL: postgresql://stripe_migrator:stripe-migrator-test@localhost:5432/opie_commerce
      EXPECTED_COMMERCE_SCHEMA_VERSION: 0001_initial.sql
      SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      OPIE_INTERNAL_SECRET: 0123456789abcdef0123456789abcdef
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: opie_commerce
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.28.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:secret-capture
      - name: Provision isolated migration and runtime roles
        run: psql postgresql://postgres:postgres@localhost:5432/opie_commerce -f .github/sql/provision-commerce-test.sql
      - name: Migrate Stripe as stripe_migrator
        run: pnpm --filter saleor-app-payment-stripe migrate:postgres
      - name: Migrate SMTP as smtp_migrator
        env:
          COMMERCE_DATABASE_DIRECT_URL: postgresql://smtp_migrator:smtp-migrator-test@localhost:5432/opie_commerce
        run: pnpm --filter saleor-app-smtp migrate:postgres
      - run: pnpm --filter @saleor/postgres-persistence check-types
      - run: pnpm --filter saleor-app-payment-stripe check-types
      - run: pnpm --filter saleor-app-smtp check-types
      - run: pnpm --filter @saleor/postgres-persistence lint
      - run: pnpm --filter saleor-app-payment-stripe lint
      - run: pnpm --filter saleor-app-smtp lint
      - run: pnpm --filter @saleor/postgres-persistence exec vitest run --pool=threads --poolOptions.threads.singleThread=true
      - run: pnpm --filter saleor-app-payment-stripe exec vitest run --project=unit --pool=threads --poolOptions.threads.singleThread=true
      - name: Required PostgreSQL Stripe integration gate
        run: pnpm --filter saleor-app-payment-stripe test:integration
      - name: Publish executed Stripe integration count
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stripe-integration-test-count
          path: apps/stripe/test-results/stripe-integration-*.txt
          if-no-files-found: error
      - run: pnpm --filter saleor-app-smtp exec vitest run
      - run: pnpm --filter saleor-app-payment-stripe build
      - run: pnpm --filter saleor-app-smtp build
