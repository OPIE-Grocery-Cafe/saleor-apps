name: OPIE Stripe Production Gate

on:
  pull_request:
    paths:
      - apps/stripe/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - turbo.json
      - .nvmrc
  push:
    branches: [railway-stripe]

permissions:
  contents: read

concurrency:
  group: opie-stripe-production-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stripe:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      HUSKY: 0
      APL: file
      SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DYNAMODB_MAIN_TABLE_NAME: opie-stripe-ci
      AWS_REGION: us-east-1
      OPIE_INTERNAL_SECRET: 0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.28.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter saleor-app-payment-stripe check-types
      - run: pnpm --filter saleor-app-payment-stripe lint
      - run: pnpm --filter saleor-app-payment-stripe exec vitest run --project=unit
      - run: pnpm --filter saleor-app-payment-stripe build
